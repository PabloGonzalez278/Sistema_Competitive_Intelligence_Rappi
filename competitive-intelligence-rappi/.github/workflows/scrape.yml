name: Competitive Intelligence Scraper

on:
  # Ejecución manual
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Plataformas a scrapear (rappi,uber_eats,didi_food)'
        required: false
        default: 'rappi uber_eats didi_food'
      addresses:
        description: 'Número de direcciones (default: todas)'
        required: false
        default: '30'

  # Ejecución programada: Lunes, Miércoles y Viernes a las 10:00 AM CST
  schedule:
    - cron: '0 16 * * 1,3,5'

env:
  SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
  USE_PROXY: ${{ secrets.USE_PROXY || 'false' }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Run scraper
        run: |
          python main.py \
            --platforms ${{ github.event.inputs.platforms || 'rappi uber_eats didi_food' }} \
            --addresses ${{ github.event.inputs.addresses || '30' }} \
            --report
        env:
          LOG_LEVEL: INFO

      - name: Upload raw data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraping-data-${{ github.run_number }}
          path: |
            data/raw/*.json
          retention-days: 90

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ github.run_number }}
          path: |
            reports/*.html
          retention-days: 90

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ github.run_number }}
          path: |
            data/screenshots/*.png
          retention-days: 30

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ github.run_number }}
          path: |
            logs/*.log
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## Scraping Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms:** ${{ github.event.inputs.platforms || 'rappi uber_eats didi_food' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Data Files" >> $GITHUB_STEP_SUMMARY
          ls -lh data/raw/*.json 2>/dev/null || echo "No data files generated"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Reports" >> $GITHUB_STEP_SUMMARY
          ls -lh reports/*.html 2>/dev/null || echo "No reports generated"
